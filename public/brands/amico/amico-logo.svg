<svg xmlns="http://www.w3.org/2000/svg" width="238" height="74" viewBox="0 0 238 74" role="img" aria-label="AMICO">
  <title>AMICO®</title>
  <defs>
    <linearGradient id="amico-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E969E"/>
      <stop offset="16%" stop-color="#C9D0D6"/>
      <stop offset="30%" stop-color="#F8FAFB"/>
      <stop offset="42%" stop-color="#FFFFFF"/>
      <stop offset="56%" stop-color="#D2D8DE"/>
      <stop offset="72%" stop-color="#949CA4"/>
